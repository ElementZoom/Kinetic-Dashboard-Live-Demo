<!-- ElementZoom live demo: paste into a WordPress "Custom HTML" block. The demo folder must be uploaded to /demo/ on the same site. -->
<iframe id="ez-demo" src="/demo/" title="ElementZoom live demo" loading="lazy" style="display:block;width:100%;height:900px;border:0;overflow:hidden"></iframe>
<script>
(function () {
  var f = document.getElementById("ez-demo");
  function vp() { try { f.contentWindow.postMessage({ ezViewport: window.innerHeight }, "*"); } catch (e) {} }
  window.addEventListener("message", function (e) { if (e.source === f.contentWindow && e.data && e.data.ezDemoHeight) f.style.height = e.data.ezDemoHeight + "px"; });
  f.addEventListener("load", vp); window.addEventListener("resize", vp);
})();
</script>
